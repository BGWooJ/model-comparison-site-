<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Choosing the Right Model</title>
<style>
  :root{
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --surface-2: #F4EFE7;
    --line: rgba(28,27,26,0.09);
    --text: #1C1B1A;
    --text-dim: #6E6A63;
    --text-faint: #A6A198;
    --unit: 8px;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif{
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Georgia", serif;
  }
  .page{
    max-width: 1120px;
    margin: 0 auto;
    padding: 64px 40px 56px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 48px;
    gap: 24px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 32px;
  }
  .kicker{
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #B8511F;
    font-weight: 700;
    margin: 0 0 12px;
  }
  h1{
    font-size: 42px;
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin: 0;
    font-weight: 500;
    max-width: 560px;
  }
  header p{
    max-width: 280px;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
    margin: 0;
    text-align: right;
  }

  /* ---------- Tab row (model selector) ---------- */
  .tabs-label{
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 16px;
  }
  .tabs{
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }
  .tab{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .tab:hover{ transform: translateY(-2px); }
  .tab.active{
    border-color: var(--tab-accent);
    background: var(--tab-tint);
  }
  .tab-plate{
    width: 40px; height: 40px;
    border-radius: 8px;
    background: #FFFFFF;
    border: 1px solid var(--line);
    flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
    overflow: hidden;
    padding: 4px;
  }
  .tab-plate img{ width: 100%; height: 100%; object-fit: contain; }
  .tab-text{ min-width: 0; }
  .tab-name{
    font-size: 12px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab-provider{
    font-size: 9.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 1px;
  }

  /* ---------- Focal card ---------- */
  .focal{
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 48px -32px rgba(28,27,26,0.18);
  }
  .focal-art{
    background: var(--focal-tint);
    padding: 40px 32px;
    display:flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    position: relative;
    border-right: 1px solid var(--line);
  }
  .focal-num{
    position: absolute;
    top: 20px; left: 24px;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.05em;
  }
  .focal-plate{
    width: 100%;
    max-width: 180px;
    height: 110px;
    border-radius: 14px;
    background: #FFFFFF;
    border: 1.5px solid var(--focal-accent);
    display:flex; align-items:center; justify-content:center;
    padding: 16px;
    box-shadow: 0 12px 24px -16px rgba(28,27,26,0.25);
  }
  .focal-plate img{ width: 100%; height: 100%; object-fit: contain; }
  .focal-art h2{
    margin: 0;
    font-size: 24px;
    font-weight: 500;
  }
  .focal-art .provider{
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-top: -10px;
  }
  .focal-band{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--focal-accent);
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 16px;
  }

  .focal-body{
    display: flex;
    flex-direction: column;
    gap: 24px;
    min-width: 0;
    padding: 40px 40px 40px 36px;
  }
  .focal-desc{
    margin: 0;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    padding: 0 0 24px;
    border-bottom: 1px solid var(--line);
  }
  .attrs{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px 32px;
  }
  .attr{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .attr-label{
    font-size: 10.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display:flex;
    justify-content: space-between;
  }
  .attr-blocks{
    display:flex;
    gap: 4px;
  }
  .attr-blocks span{
    flex: 1;
    height: 8px;
    border-radius: 3px;
    background: var(--surface-2);
  }
  .attr-blocks span.on{ background: var(--focal-accent); }
  .attr.files .attr-value{
    font-size: 13.5px;
    font-weight: 600;
  }
  .attr.files .attr-value.yes{ color: #3F7A3D; }
  .attr.files .attr-value.no{ color: var(--text-faint); }

  /* ---------- Legend / footer ---------- */
  .legend{
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }
  .legend-item{
    display:flex;
    gap: 12px;
    align-items: flex-start;
  }
  .legend-item .dot{
    width: 8px; height: 8px;
    border-radius: 2px;
    background: #B8511F;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .legend-item h4{
    margin: 0 0 4px;
    font-size: 12.5px;
    font-weight: 700;
  }
  .legend-item p{
    margin: 0;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  @media (max-width: 900px){
    .tabs{ grid-template-columns: repeat(2, 1fr); }
    .focal{ grid-template-columns: 1fr; }
    .focal-art{ border-right: none; border-bottom: 1px solid var(--line); }
    .focal-body{ padding: 32px; }
    .attrs{ grid-template-columns: 1fr; }
    .legend{ grid-template-columns: 1fr; }
    header{ flex-direction: column; align-items: flex-start; }
    header p{ text-align: left; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div>
      <p class="kicker">Model Guide</p>
      <h1 class="serif">Five models, five jobs. Pick by what you're doing, not the name.</h1>
    </div>
    <p>A quick-reference guide for choosing the right AI model without needing to know the technical details.</p>
  </header>

  <p class="tabs-label">Choose a model</p>
  <div class="tabs" id="tabs"></div>

  <div class="focal" id="focal"></div>

  <div class="legend" id="legend"></div>

</div>

<script>
function blocks(value, total){
  let html = "";
  for (let i = 0; i < total; i++){
    html += `<span class="${i < value ? 'on' : ''}"></span>`;
  }
  return html;
}

const MODELS = [
  {
    id: "sonnet5", name: "Claude 5 Sonnet", provider: "Anthropic",
    tagline: "The Reliable Everyday Choice",
    desc: "Handles uploaded files well — spreadsheets, attached code, documents. Best for everyday tasks needing solid, multi-step reasoning without the wait of a flagship model.",
    logo: "assets/claude.jpg",
    accent: "#B8511F", tint: "#F7E0D2",
    reasoning: 3, speed: 4, files: true, power: 62,
  },
  {
    id: "opus48", name: "Claude Opus 4.8", provider: "Anthropic",
    tagline: "The Powerhouse", hero: true,
    desc: "Built for your most complex, high-stakes work — deep financial analysis, comparing massive multi-file documents. Choose it when accuracy matters more than speed.",
    logo: "assets/claude.jpg",
    accent: "#9C3F17", tint: "#F1C7AC",
    reasoning: 5, speed: 2, files: true, power: 92,
  },
  {
    id: "gptoss120", name: "GPT-OSS 120B", provider: "OpenAI",
    tagline: "The Deep Thinker",
    desc: "Excels at advanced, text-only reasoning and complex problem-solving — brainstorming, drafting intricate reports, generating code from a prompt. No file uploads.",
    logo: "assets/gptoss.jpg",
    accent: "#433F52", tint: "#E2DCEC",
    reasoning: 4, speed: 3, files: false, power: 74,
  },
  {
    id: "gptoss20", name: "GPT-OSS 20B", provider: "OpenAI",
    tagline: "The Quick Chat",
    desc: "Optimized for fast, logical text tasks — drafting messages, structuring notes, quick questions. High-speed reasoning without file handling.",
    logo: "assets/gptoss.jpg",
    accent: "#5B5568", tint: "#EDEAF2",
    reasoning: 2, speed: 5, files: false, power: 28,
  },
  {
    id: "nemotron", name: "Nemotron 3 Super 120B", provider: "NVIDIA",
    tagline: "The Instant Reply",
    desc: "Rapid, direct text generation with no multi-step reasoning or file support. Best for simple classification, formatting, or standard boilerplate — pure speed.",
    logo: "assets/nemotron.jpg",
    accent: "#4C7A2E", tint: "#DCEEC9",
    reasoning: 1, speed: 5, files: false, power: 80,
  },
];

const LEGEND = [
  { title: "Reasoning Depth", body: "How well the model handles complex, multi-step thinking — more blocks means it can untangle harder problems." },
  { title: "Response Speed", body: "How quickly you get an answer — more blocks means less waiting, which matters for quick back-and-forth chat." },
  { title: "Handles Your Files", body: "Whether you can upload documents, spreadsheets, or images for the model to read and work from directly." },
  { title: "Power Level", body: "A blended score of reasoning and speed — higher means a more broadly capable model overall, not always the right pick for a quick task." },
];

const tabs = document.getElementById("tabs");
const focal = document.getElementById("focal");
const legend = document.getElementById("legend");
let activeId = (MODELS.find(m => m.hero) || MODELS[0]).id;

function renderFocal(){
  const m = MODELS.find(x => x.id === activeId);
  focal.style.setProperty("--focal-accent", m.accent);
  focal.style.setProperty("--focal-tint", m.tint);
  focal.innerHTML = `
    <div class="focal-art">
      <span class="focal-num">No. ${String(MODELS.indexOf(m)+1).padStart(2,'0')}</span>
      <div class="focal-plate"><img src="${m.logo}" alt="${m.provider} logo"></div>
      <h2 class="serif">${m.name}</h2>
      <div class="provider">${m.provider}</div>
      <div class="focal-band">${m.tagline}</div>
    </div>
    <div class="focal-body">
      <p class="focal-desc">${m.desc}</p>
      <div class="attrs">
        <div class="attr">
          <span class="attr-label"><span>Reasoning</span><span>${m.reasoning}/5</span></span>
          <div class="attr-blocks">${blocks(m.reasoning, 5)}</div>
        </div>
        <div class="attr">
          <span class="attr-label"><span>Speed</span><span>${m.speed}/5</span></span>
          <div class="attr-blocks">${blocks(m.speed, 5)}</div>
        </div>
        <div class="attr files">
          <span class="attr-label"><span>Handles Files</span></span>
          <span class="attr-value ${m.files ? 'yes' : 'no'}">${m.files ? "Yes — uploads supported" : "No — text only"}</span>
        </div>
        <div class="attr power">
          <span class="attr-label"><span>Power Level</span><span>${m.power}/100</span></span>
          <div class="attr-blocks">${blocks(Math.round(m.power/20), 5)}</div>
        </div>
      </div>
    </div>
  `;
}

function renderTabs(){
  tabs.innerHTML = "";
  MODELS.forEach(m => {
    const tab = document.createElement("button");
    tab.className = "tab" + (m.id === activeId ? " active" : "");
    tab.style.setProperty("--tab-accent", m.accent);
    tab.style.setProperty("--tab-tint", m.tint);
    tab.innerHTML = `
      <div class="tab-plate"><img src="${m.logo}" alt="${m.provider} logo"></div>
      <div class="tab-text">
        <div class="tab-name">${m.name}</div>
        <div class="tab-provider">${m.provider}</div>
      </div>
    `;
    tab.addEventListener("click", () => {
      activeId = m.id;
      renderFocal();
      renderTabs();
    });
    tabs.appendChild(tab);
  });
}

function renderLegend(){
  legend.innerHTML = LEGEND.map(item => `
    <div class="legend-item">
      <div class="dot"></div>
      <div>
        <h4>${item.title}</h4>
        <p>${item.body}</p>
      </div>
    </div>
  `).join("");
}

renderFocal();
renderTabs();
renderLegend();
</script>

</body>
</html>
