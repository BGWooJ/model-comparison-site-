<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Choosing the Right Model</title>
<style>
  :root{
    --bg: #0B0B0D;
    --surface: #16161A;
    --surface-2: #1D1D22;
    --line: rgba(255,255,255,0.08);
    --text: #F2F1EE;
    --text-dim: #9B9AA3;
    --text-faint: #6B6A73;
    --accent: #E8664A;
    --unit: 8px;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page{
    max-width: 1120px;
    margin: 0 auto;
    padding: 64px 40px 56px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 48px;
    gap: 24px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 32px;
  }
  .kicker{
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 12px;
  }
  h1{
    font-size: 40px;
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0;
    font-weight: 700;
    max-width: 560px;
  }
  header p{
    max-width: 300px;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
    margin: 0;
    text-align: right;
  }
